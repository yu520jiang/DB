%YAML:1.0
---
# ===========================================================================
# 救援物块识别参数（OpenCV HSV：H 0~179，S 0~255，V 0~255）
#
# 类别映射（赛题）：
#   绿色  正方体   -> 普通物资  NORMAL_MATERIAL
#   黑色  三棱锥   -> 核心物资  CORE_MATERIAL
#   橘色  长方体   -> 伤员      CASUALTY
#   浅蓝  正方体   -> 危险目标  DANGER（只识别 / 绕行）
#
# 现场光照变化较大时，先跑 tools/tune_hsv 逐色标定，再把数值填回来。
# ===========================================================================
color:
   # 绿色正方体（普通物资）
   green:
      lower: [ 35., 80., 40. ]
      upper: [ 85., 255., 255. ]
   # 浅蓝正方体（危险目标）——H 与绿色分开，避免同形混淆
   light_blue:
      lower: [ 88., 60., 90. ]
      upper: [ 118., 255., 255. ]
   # 橘色长方体（伤员）——橘色偏红，H 两端各补一段
   orange:
      lower: [ 0., 110., 90. ]
      upper: [ 22., 255., 255. ]
      lower2: [ 168., 110., 90. ]
      upper2: [ 179., 255., 255. ]
   # 黑色三棱锥（核心物资）——黑色饱和度低，直接用 V 上限判定
   black:
      lower: [ 0., 0., 0. ]
      upper: [ 179., 255., 65. ]

   min_area: 600          # 最小连通域面积（像素）
   morph_kernel: 5        # 形态学核尺寸，<=0 关闭
   open_iter: 1           # 开运算次数（去小噪点）
   close_iter: 1          # 闭运算次数（补孔）

shape:
   approx_eps_ratio: 2.0e-02   # approxPolyDP 精度 = 该值 × 轮廓周长
   min_area: 600               # 参与形状判定的最小面积
   cube_max_aspect: 1.35       # 长宽比 <= 该值 -> 正方体；大于 -> 长方体
   triangle_fill_max: 0.62     # 面积/包围盒面积 < 该值 -> 三棱锥（三角形）
   min_solidity: 0.72          # 面积/凸包面积，过滤破碎轮廓

depth:
   depth_scale: 1.0e-03   # 深度原始值 -> 米（RealSense z16 为 1mm）
   valid_min: 1           # 有效深度下限（原始单位）
   valid_max: 10000       # 有效深度上限（原始单位，约 10m）
   roi_shrink: 0.2        # 只取 bbox 中心 60% 区域取中值，避边缘混合像素
